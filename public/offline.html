<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>땅콩페밀리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #F5F5F7;
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      gap: 16px;
    }
    .peanut { font-size: 64px; line-height: 1; }
    h1 { font-size: 19px; font-weight: 700; }
    p { font-size: 14px; color: #636366; line-height: 1.6; max-width: 280px; }
    button {
      margin-top: 8px;
      padding: 13px 28px;
      border: none; border-radius: 999px;
      background: #E8943A; color: #fff;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.6; }
    .hint { font-size: 12px; color: #a0a0a5; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="peanut">🥜</div>
    <h1>연결할 수 없어요</h1>
    <p>서버에 닿지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button id="retry" onclick="retry()">다시 시도</button>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    function retry() {
      var b = document.getElementById('retry');
      b.disabled = true; b.textContent = '연결 중…';
      // 서버 URL로 다시 이동 시도(성공하면 앱이 그대로 로드됨)
      window.location.href = 'https://syngha.synology.me:2290';
      // 여전히 실패하면 errorPath가 다시 이 페이지를 띄움 → 버튼 복구
      setTimeout(function () { b.disabled = false; b.textContent = '다시 시도'; }, 4000);
    }
  </script>
</body>
</html>
